name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://aegisflow:aegisflow@localhost:5432/aegisflow_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aegisflow
          POSTGRES_PASSWORD: aegisflow
          POSTGRES_DB: aegisflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisflow -d aegisflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Install from committed lockfile
        run: npm ci --ignore-scripts
      - name: Verify install did not mutate dependency declarations
        run: git diff --exit-code -- package-lock.json package.json packages/*/package.json
      - name: Verify source and package boundaries
        run: npm run verify
      - name: Verify PostgreSQL migrations and repositories
        run: npm run test:postgres
      - name: Verify deterministic demo and failure scenarios
        run: npm run demo:deterministic
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
